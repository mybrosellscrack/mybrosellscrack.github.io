<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="preview5-title">
    <title id="preview5-title">Ложный выбор между Востоком и Западом и путь Церкви</title>
    <defs>
        <linearGradient id="preview5-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f7f1e7"/>
            <stop offset="55%" stop-color="#eef3f1"/>
            <stop offset="100%" stop-color="#e2ecec"/>
        </linearGradient>
        <radialGradient id="preview5-cross" cx="42%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#6f98a6"/>
            <stop offset="60%" stop-color="#3f6876"/>
            <stop offset="100%" stop-color="#2d4f5c"/>
        </radialGradient>
        <filter id="preview5-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#2b2a28" flood-opacity=".12"/>
        </filter>
    </defs>
    <rect width="400" height="260" fill="url(#preview5-bg)"/>
    <circle cx="200" cy="130" r="112" fill="none" stroke="rgba(58,95,111,.12)" stroke-dasharray="2 8"/>
    <path d="M200 230V105" fill="none" stroke="#3f6876" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M200 160C160 145 120 110 85 78M200 160c40-15 80-50 115-82" fill="none" stroke="rgba(58,95,111,.45)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 6"/>
    <path d="M85 78l-6 12 14-3M315 78l6 12-14-3" fill="none" stroke="rgba(58,95,111,.55)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="200" cy="62" r="34" fill="url(#preview5-cross)" filter="url(#preview5-shadow)"/>
    <g stroke="#fff" stroke-width="2.8" stroke-linecap="round" opacity=".95">
        <path d="M200 45v26M191 53h18"/>
    </g>
    <circle cx="85" cy="78" r="22" fill="#cfe3e8" opacity=".9"/>
    <circle cx="315" cy="78" r="22" fill="#e8cfc9" opacity=".9"/>
    <text x="85" y="120" text-anchor="middle" font-family="'Palatino Linotype', 'Book Antiqua', Palatino, serif" font-size="10" fill="#2f5a69">Восток</text>
    <text x="315" y="120" text-anchor="middle" font-family="'Palatino Linotype', 'Book Antiqua', Palatino, serif" font-size="10" fill="#8a4d43">Запад</text>
    <text x="200" y="115" text-anchor="middle" font-family="'Palatino Linotype', 'Book Antiqua', Palatino, serif" font-size="11" fill="#2d4f5c">Церковь</text>
    <text x="200" y="246" text-anchor="middle" font-family="'Palatino Linotype', 'Book Antiqua', Palatino, serif" font-size="10" fill="#3d6b52">Синергия</text>
    <g fill="#b36b4b" opacity=".55">
        <circle cx="40" cy="52" r="2.5"/>
        <circle cx="360" cy="60" r="2"/>
        <circle cx="48" cy="150" r="2"/>
        <circle cx="354" cy="148" r="2.5"/>
