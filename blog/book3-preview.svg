<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="book3-preview-title">
    <title id="book3-preview-title">Крещальная купель, вода и крест</title>
    <defs>
        <linearGradient id="book3-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f7f1e7"/>
            <stop offset="55%" stop-color="#eef3f1"/>
            <stop offset="100%" stop-color="#e2ecec"/>
        </linearGradient>
        <linearGradient id="book3-gold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f6e7cc"/>
            <stop offset="100%" stop-color="#d2ad78"/>
        </linearGradient>
        <radialGradient id="book3-water" cx="50%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#dff0f3"/>
            <stop offset="60%" stop-color="#9fc1ca"/>
            <stop offset="100%" stop-color="#5f8b99"/>
        </radialGradient>
        <radialGradient id="book3-cross" cx="42%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#6f98a6"/>
            <stop offset="60%" stop-color="#3f6876"/>
            <stop offset="100%" stop-color="#2d4f5c"/>
        </radialGradient>
        <filter id="book3-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#2b2a28" flood-opacity=".12"/>
        </filter>
    </defs>
    <rect width="400" height="260" fill="url(#book3-bg)"/>
    <circle cx="200" cy="130" r="112" fill="none" stroke="rgba(58,95,111,.12)" stroke-dasharray="2 8"/>
