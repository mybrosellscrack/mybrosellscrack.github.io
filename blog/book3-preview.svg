    <ellipse cx="200" cy="155" rx="82" ry="14" fill="url(#book3-water)"/>
    <path d="M134 156q18 5 33 0t33 0 33 0 33 0" fill="none" stroke="#f4fbfc" stroke-width="1.6" stroke-linecap="round" opacity=".75"/>
    <rect x="190" y="194" width="20" height="31" rx="5" fill="#d2ad78"/>
    <rect x="158" y="222" width="84" height="10" rx="5" fill="#c99c62" opacity=".9"/>
    <g fill="#7fa9b5" opacity=".75">
