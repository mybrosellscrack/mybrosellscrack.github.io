    <text x="95" y="256" text-anchor="middle" font-family="'Palatino Linotype', 'Book Antiqua', Palatino, serif" font-size="9" fill="#8a4d43">Пелагий</text>
    <text x="305" y="256" text-anchor="middle" font-family="'Palatino Linotype', 'Book Antiqua', Palatino, serif" font-size="9" fill="#2f5a69">Августин</text>
    <text x="234" y="38" text-anchor="start" font-family="'Palatino Linotype', 'Book Antiqua', Palatino, serif" font-size="9" fill="#2d4f5c">Синергия</text>
    <g fill="#b36b4b" opacity=".55">
