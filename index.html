<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Духовный дневник — Блог</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="blog.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <img src="favicon.svg" alt="" class="brand-icon" />
          <div class="brand-text">
            <div class="brand-title">Духовный дневник</div>
            <div class="brand-subtitle">Блог статей</div>
          </div>
        </div>
      </div>
    </header>

    <main class="app-main">
      <!-- Секция Блога (список статей) -->
      <section id="view-blog" class="view active">
        <div class="card">
          <h2>Блог статей</h2>
          <p class="hint">Размышления о духовной жизни, антропологии и психологии</p>
          <div id="blog-list" class="blog-list"></div>
          <p id="blog-empty" class="empty">Статьи загружаются…</p>
        </div>
      </section>

    </main>

    <footer class="app-footer">
      <a href="https://духовный-дневник.рф" target="_blank" rel="noopener">духовный-дневник.рф</a>
      <span class="footer-divider">·</span>
      <a href="https://github.com/mybrosellscrack/mybrosellscrack.github.io" target="_blank">Исходный код на GitHub</a>
      <span class="footer-divider">·</span>
      <a href="https://yoomoney.ru/to/4100119492913829" target="_blank">Поддержать автора</a>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
